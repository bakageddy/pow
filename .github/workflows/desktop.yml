name: Desktop
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux WebKit/GTK dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
      - name: Install shared PEV2 parser dependencies
        run: npm ci --ignore-scripts
      - run: npm ci
        working-directory: desktop
      - run: npm test
        working-directory: desktop
      - run: npm run build
        working-directory: desktop
      - run: cargo test --manifest-path desktop/src-tauri/Cargo.toml
      - name: Bundle desktop application
        run: npm run tauri -- build
        working-directory: desktop
      - name: Verify Debian package provides the pow CLI
        if: matrix.platform == 'ubuntu-22.04'
        run: dpkg-deb --contents desktop/src-tauri/target/release/bundle/deb/*.deb | grep -q 'usr/bin/pow$'
      - uses: actions/upload-artifact@v4
        with:
          name: pow-${{ matrix.platform }}
          path: |
            desktop/src-tauri/target/release/bundle/**
          if-no-files-found: error
